{% set name = "reports" %}
{% set version = "0.3.1" %}
{% set sha256 = "72b5d5d1f8a452f4c8b1f69862c2d6bc4ac953490273b23b232dc35692c01755" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: reports-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}
    - setuptools
    - easydev
    - pandas
    - colormap
    - jinja2


test:
  requires:
    - python {{ python_min }}
  imports:
    - reports
    - reports.resources

about:
  home: 'http://github.com/cokelaer/reports/'
  license: BSD 3-clause
  license_family: BSD
  license_file: LICENSE
  doc_url: http://reports.readthedocs.io/en/latest
  dev_url: https://github.com/cokelaer/reports

  summary: 'Quickly create HTML reports using a set of JINJA templates'

extra:
  recipe-maintainers:
    - cokelaer
